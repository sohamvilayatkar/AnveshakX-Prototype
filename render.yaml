services:
  - type: web
    name: anveshakx-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -m ml.training.train_classifier && python -m ml.training.train_anomaly
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: ML_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
